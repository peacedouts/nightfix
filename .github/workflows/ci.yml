name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      # Tests run as a non-superuser that can create roles and databases,
      # exactly like the RDS master user, so nothing slips in that only a
      # superuser could do.
      NIGHTFIX_TEST_ADMIN_DSN: postgres://rds_admin:rds@localhost:5432/postgres?sslmode=disable
    steps:
      - name: Create an RDS-like admin role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE rds_admin LOGIN PASSWORD 'rds' CREATEROLE CREATEDB NOSUPERUSER"
          psql -h localhost -U postgres -c "GRANT pg_signal_backend TO rds_admin"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Build and test with a supported Go release (each is supported until
      # two newer ones exist; 1.24 stopped getting security fixes in Feb
      # 2026). go.mod's "go 1.24" is only the minimum. Keep in step with the
      # Dockerfile's golang image.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true # the newest patch release, not the runner's cached one
      - run: go mod verify
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      # Race detector on, test order shuffled (the seed is printed, so a
      # failure can be replayed with -shuffle=<seed>), and coverage counted
      # across packages so end-to-end tests credit the code they exercise.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          status=0
          go test -race -shuffle=on -count=1 -coverpkg=./... -coverprofile=cover.out ./... 2>&1 | tee test.log || status=$?
          # Surface failures as annotations on the PR (with the shuffle seed
          # to replay them), not only in the raw log.
          grep -E -e '--- FAIL|^FAIL|panic:|_test\.go:[0-9]+:|-test.shuffle' test.log | head -60 | sed 's/^/::error::/' || true
          exit $status
      - name: Coverage
        run: scripts/coverage.sh cover.out 80 | tee -a "$GITHUB_STEP_SUMMARY"

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true # the newest patch release, not the runner's cached one
      # Known vulnerabilities in dependencies and the Go toolchain that the
      # code actually reaches.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  demo:
    # The demos are what design partners see; make sure both still tell
    # the story they claim (DEMO_CHECK fails the job if not).
    runs-on: ubuntu-24.04
    env:
      DEMO_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true # the newest patch release, not the runner's cached one
      - run: make demo
      - run: make demo-fail

  commit-identity:
    # Personal email addresses must never reach the (public) history: every
    # new commit's author and committer is a no-reply address. Set
    # git config user.email to your <id>+<login>@users.noreply.github.com.
    # Merge commits on main take the merger's GitHub email: turn on "Keep my
    # email addresses private" in GitHub's email settings so they don't.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check commit identities
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi
          allowed='^([0-9]+\+[A-Za-z0-9-]+(\[bot\])?@users\.noreply\.github\.com|noreply@github\.com|noreply@anthropic\.com)'
          bad=$(git log --format='%h %ae%n%h %ce' "$BASE..$HEAD" | awk '{print $2" "$1}' | grep -Ev "$allowed " | sort -u || true)
          if [ -n "$bad" ]; then
            echo "::error::commits with a non-no-reply author or committer address:"
            echo "$bad" | sed 's/^[^ ]*@[^ ]* /<redacted address> /'
            echo "Rewrite them with your GitHub no-reply address (git commit --amend --reset-author, or git rebase -r --exec 'git commit --amend --no-edit --reset-author')."
            exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit: once public, history is public too
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: Scan the history for secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.21.2
          # Reviewed findings (test fixtures) are listed in .gitleaksignore.
          "$(go env GOPATH)/bin/gitleaks" git . --redact --log-opts="--all"

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Helm comes with the runner image.
      - name: Lint and render the agent chart
        run: |
          chart=deploy/helm/nightfix-agent
          set -- --set image.digest=sha256:$(printf '0%.0s' {1..64}) --set nightfix.endpoint=https://agent.example.com \
            --set nightfix.orgId=org_0123456789abcdef0123456789abcdef --set aws.region=us-east-1 --set nightfix.caPem=test
          helm lint --strict "$chart" "$@"
          helm template test "$chart" "$@" > rendered.yaml
          grep -q 'image: "ghcr.io/peacedouts/nightfix-agent@sha256:' rendered.yaml
          grep -q 'readOnlyRootFilesystem: true' rendered.yaml
          # Refused without a digest, or with a tag in its place.
          if helm template test "$chart" --set nightfix.endpoint=x --set nightfix.orgId=x --set aws.region=x --set nightfix.caPem=x > /dev/null 2>&1; then
            echo "::error::the chart rendered without image.digest"; exit 1
          fi
          if helm template test "$chart" "$@" --set image.digest=latest > /dev/null 2>&1; then
            echo "::error::the chart accepted a tag as the digest"; exit 1
          fi

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.12.2
      - run: terraform fmt -check -recursive deploy/terraform
      - name: Validate
        run: |
          for dir in deploy/terraform/control-plane deploy/terraform/examples/self-hosted deploy/terraform/examples/agent deploy/terraform/examples/agent-eks deploy/terraform/examples/demo-target; do
            echo "::group::$dir"
            terraform -chdir=$dir init -backend=false -input=false
            terraform -chdir=$dir validate
            echo "::endgroup::"
          done

  images:
    # Proves both images build; pushing happens in images.yml on main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: controlplane
          platforms: linux/amd64
          push: false
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: agent
          platforms: linux/amd64
          push: false
