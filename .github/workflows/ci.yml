name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      # Tests run as a non-superuser that can create roles and databases,
      # exactly like the RDS master user, so nothing slips in that only a
      # superuser could do.
      NIGHTFIX_TEST_ADMIN_DSN: postgres://rds_admin:rds@localhost:5432/postgres?sslmode=disable
    steps:
      - name: Create an RDS-like admin role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE rds_admin LOGIN PASSWORD 'rds' CREATEROLE CREATEDB NOSUPERUSER"
          psql -h localhost -U postgres -c "GRANT pg_signal_backend TO rds_admin"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go test -count=1 ./...

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.12.2
      - run: terraform fmt -check -recursive deploy/terraform
      - name: Validate
        run: |
          for dir in deploy/terraform/control-plane deploy/terraform/examples/agent; do
            echo "::group::$dir"
            terraform -chdir=$dir init -backend=false -input=false
            terraform -chdir=$dir validate
            echo "::endgroup::"
          done

  images:
    # Proves both images build; pushing happens in images.yml on main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: controlplane
          platforms: linux/amd64
          push: false
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: agent
          platforms: linux/amd64
          push: false
