name: teaser

on:
  push:
    branches: [main]
    paths: ["teaser/**", "wrangler.jsonc", ".github/workflows/teaser.yml"]
  pull_request:
    paths: ["teaser/**", "wrangler.jsonc", ".github/workflows/teaser.yml"]
  schedule:
    - cron: "17 13 * * 1" # weekly, so an expiring security.txt is caught even without changes

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: security.txt has a valid Expires date
        run: |
          f=teaser/public/.well-known/security.txt
          grep -q '^Contact: ' "$f" || { echo "::error file=$f::Contact is required (RFC 9116)"; exit 1; }
          exp=$(sed -n 's/^Expires: //p' "$f")
          [ -n "$exp" ] || { echo "::error file=$f::Expires is required (RFC 9116)"; exit 1; }
          left=$(( ( $(date -d "$exp" +%s) - $(date +%s) ) / 86400 ))
          echo "security.txt expires $exp ($left days)"
          [ "$left" -gt 30 ] || { echo "::error file=$f::Expires is $left days away; bump it (keep it under a year ahead)"; exit 1; }
          [ "$left" -le 366 ] || { echo "::error file=$f::Expires is more than a year ahead (RFC 9116 recommends less)"; exit 1; }

      - name: Page loads nothing from third parties
        run: |
          # Links out to the repository are fine; loading anything isn't.
          if grep -noE '(src|href)="https?://[^"]*"' teaser/public/*.html | grep -v 'https://nightfix.dev' | grep -vE 'href="https://github.com/peacedouts(/nightfix(/[^"]*)?)?"'; then
            echo "::error::teaser pages must be self-contained; the CSP in _headers blocks third-party assets"; exit 1
          fi

      - name: Deploy config is valid (dry run)
        run: npx --yes wrangler@4.151.3 deploy --dry-run
