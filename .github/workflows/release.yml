name: release

# Publish a version (vMAJOR.MINOR.PATCH) of a commit on main that images.yml
# has already built and signed:
#   1. check the commit is on main and the version is new and higher
#   2. resolve the agent and control-plane images for that commit to digests,
#      and verify their Sigstore signatures name images.yml on main at it
#   3. package the agent Helm chart with that agent digest as its default,
#      push it to GHCR as an OCI artifact, and sign it
#   4. tag the commit and publish a GitHub Release whose notes give the
#      digests, the commit, and the CHANGELOG section for the version
#
# Nothing is built here, and tags still never build anything: a release
# only names images main already produced. Clients pin the digests and the
# commit from the notes (a tag can be moved by anyone with write access,
# unless a tag ruleset protects v*; see deploy/README.md, Releases).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, e.g. v1.4.0
        required: true
      commit:
        description: Full commit SHA on main. Empty means main's head.
        required: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag and release
      packages: write # push the chart
      id-token: write # sign the chart
    env:
      VERSION: ${{ inputs.version }}
      OWNER: ${{ github.repository_owner }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Check the version and commit
        id: commit
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          if ! [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::version must look like v1.4.0"; exit 1
          fi
          commit="${COMMIT:-$(git rev-parse origin/main)}"
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit must be a full 40-character SHA"; exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::$commit is not on main"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" > /dev/null; then
            echo "::error::$VERSION already exists"; exit 1
          fi
          latest=$(git tag -l 'v*.*.*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "::error::$VERSION is not higher than the latest release, $latest"; exit 1
          fi
          echo "sha=$commit" >> "$GITHUB_OUTPUT"

      # Before anything is published: the notes come from CHANGELOG.md as of
      # the released commit, and a version without a section stops here.
      - name: Read the CHANGELOG section
        env:
          COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          v="${VERSION#v}"
          # A heading "## [1.4.0]", "## 1.4.0" or "## v1.4.0 - date": compare
          # its first word, without brackets or a v, to the version exactly.
          git show "$COMMIT:CHANGELOG.md" | awk -v v="$v" '
            /^## / { h = substr($0, 4); gsub(/[][]/, "", h); sub(/^v/, "", h); split(h, w, " ")
                     if (on) exit; if (w[1] == v) { on = 1; next } }
            on { print }' > changelog-section.md
          if [ -z "$(tr -d '[:space:]' < changelog-section.md)" ]; then
            echo "::error::CHANGELOG.md at $COMMIT has no section for $v"; exit 1
          fi

      - name: Resolve and verify the images
        id: images
        env:
          COMMIT: ${{ steps.commit.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN" > /dev/null
          for name in agent controlplane; do
            ref="ghcr.io/$OWNER/nightfix-$name:sha-$COMMIT"
            digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::no image $ref (did images.yml run for this commit?)"; exit 1
            fi
            cosign verify "ghcr.io/$OWNER/nightfix-$name@$digest" \
              --certificate-identity "https://github.com/$GH_REPO/.github/workflows/images.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-sha "$COMMIT" > /dev/null
            echo "$name=ghcr.io/$OWNER/nightfix-$name@$digest" >> "$GITHUB_OUTPUT"
            echo "${name}_digest=$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Package, push and sign the agent chart
        id: chart
        env:
          COMMIT: ${{ steps.commit.outputs.sha }}
          AGENT_DIGEST: ${{ steps.images.outputs.agent_digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git worktree add ../at-release "$COMMIT"
          chart=../at-release/deploy/helm/nightfix-agent
          # The released chart defaults to the released agent.
          # Its image is this repository's (a fork's release points at the fork's).
          sed -i -e "s|^  repository: ghcr.io/[^/]*/nightfix-agent$|  repository: ghcr.io/$OWNER/nightfix-agent|" \
                 -e "s|^  digest: \"\"|  digest: \"$AGENT_DIGEST\"|" "$chart/values.yaml"
          grep -q "repository: ghcr.io/$OWNER/nightfix-agent" "$chart/values.yaml"
          grep -q "digest: \"$AGENT_DIGEST\"" "$chart/values.yaml"
          helm package "$chart" --version "${VERSION#v}" --app-version "${VERSION#v}" -d out
          helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"
          pushed=$(helm push "out/nightfix-agent-${VERSION#v}.tgz" "oci://ghcr.io/$OWNER/charts" 2>&1 | tee /dev/stderr)
          digest=$(sed -n 's/^Digest: //p' <<<"$pushed")
          cosign sign --yes "ghcr.io/$OWNER/charts/nightfix-agent@$digest"
          echo "ref=oci://ghcr.io/$OWNER/charts/nightfix-agent" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Tag and publish the release
        env:
          COMMIT: ${{ steps.commit.outputs.sha }}
          AGENT: ${{ steps.images.outputs.agent }}
          CONTROLPLANE: ${{ steps.images.outputs.controlplane }}
          CHART: ${{ steps.chart.outputs.ref }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat changelog-section.md
            echo
            echo "## Pin these"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$COMMIT\` |"
            echo "| Control plane image | \`$CONTROLPLANE\` |"
            echo "| Agent image | \`$AGENT\` |"
            echo "| Agent Helm chart | \`$CHART\` version \`${VERSION#v}\` (\`$CHART_DIGEST\`) |"
            echo "| Terraform modules | \`github.com/$GH_REPO//deploy/terraform/modules/<module>?ref=$COMMIT\` |"
            echo
            echo "Roll out the control plane with \`deploy/scripts/rollout.sh $CONTROLPLANE $COMMIT\`. Images are signed by \`images.yml\` on \`main\` at this commit; the chart by \`release.yml\`. Verify with cosign (deploy/README.md, Releases)."
          } > notes.md
          git tag "$VERSION" "$COMMIT"
          git push origin "refs/tags/$VERSION"
          gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file notes.md
