name: images

# On every push to main: build both images for amd64 and arm64, push them
# with an SBOM and build provenance, and sign them with Sigstore (keyless, so
# the signature names this workflow on main).
#
#   agent:         ghcr.io/<owner>/nightfix-agent:sha-<commit>. Make the package
#                  public in GitHub → Packages so customers can pull it.
#   control plane: ghcr.io/<owner>/nightfix-controlplane:sha-<commit> (arm64),
#                  the release self-hosted deployments roll out with
#                  deploy/scripts/rollout.sh (make the package public too); and
#                  ECR :<commit> for the reference deployment, once the
#                  AWS_PUSH_ROLE_ARN and ECR_REPOSITORY repository variables
#                  are set (outputs of deploy/terraform/control-plane).
#
# Only main builds images, and only immutable commit tags are published (no
# :latest, no :main, no release tags). Anyone with write access can push a
# tag, so tags never get a pushed or signed image. Customers pin a digest
# (GHCR tags can be re-pushed, so a sha- tag is only a way to find one);
# deploys verify the signature names images.yml on main and the commit.

on:
  push:
    branches: [main]
  # To build the current main commit again, e.g. after setting the AWS
  # repository variables. Only main builds; an existing ECR tag is kept.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # Sigstore keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/nightfix-agent
          tags: |
            type=sha,format=long
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - name: Sign
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/nightfix-agent@${{ steps.build.outputs.digest }}

  controlplane-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # Sigstore keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No QEMU: the build stage cross-compiles, and the final stage has no RUN.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/nightfix-controlplane
          tags: |
            type=sha,format=long
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: controlplane
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - name: Sign
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/nightfix-controlplane@${{ steps.build.outputs.digest }}

  controlplane:
    if: github.ref == 'refs/heads/main' && vars.AWS_PUSH_ROLE_ARN != '' && vars.ECR_REPOSITORY != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # AWS OIDC and Sigstore keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No QEMU: the build stage runs natively and cross-compiles, and the
      # final stage has no RUN, so nothing executes as arm64.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      # ECR tags are immutable: a re-run for a commit that's already pushed
      # keeps the existing image, and signs it if an earlier run pushed it
      # but failed to sign (deploys refuse unsigned images).
      - id: exists
        env:
          REPO: ${{ vars.ECR_REPOSITORY }}
        run: |
          digest=$(aws ecr describe-images --repository-name "${REPO#*/}" --image-ids imageTag="$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
          if [ -n "$digest" ] && [ "$digest" != "None" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "$REPO:$GITHUB_SHA is already pushed ($digest)."
          fi
      - id: build
        if: steps.exists.outputs.already != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: controlplane
          platforms: linux/arm64
          push: true
          tags: ${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          sbom: true
          provenance: mode=max
      - name: Sign
        if: steps.exists.outputs.already != 'true'
        run: cosign sign --yes ${{ vars.ECR_REPOSITORY }}@${{ steps.build.outputs.digest }}
      - name: Sign the existing image if it isn't signed
        if: steps.exists.outputs.already == 'true'
        env:
          IMAGE: ${{ vars.ECR_REPOSITORY }}@${{ steps.exists.outputs.digest }}
          GH_REPO: ${{ github.repository }}
        run: |
          if cosign verify "$IMAGE" \
              --certificate-identity "https://github.com/$GH_REPO/.github/workflows/images.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-github-workflow-sha "$GITHUB_SHA" > /dev/null 2>&1; then
            echo "Already signed."
          else
            cosign sign --yes "$IMAGE"
          fi
