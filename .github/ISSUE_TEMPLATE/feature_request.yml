name: Feature request
description: Something Nightfix should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
