<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightfix</title>
<meta name="description" content="Quieter nights are coming.">
<meta property="og:title" content="Nightfix">
<meta property="og:description" content="Quieter nights are coming.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://nightfix.dev/">
<meta name="theme-color" content="#0B0E17">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500&display=swap">
<style>
  :root {
    --ground: #0B0E17;
    --text: #ECEBF3;
    --muted: #9A9DB5;
    --dim: #7F829C;
    --line: rgba(236, 235, 243, 0.12);
    --serif: 'Instrument Serif', 'Times New Roman', serif;
    --sans: 'Instrument Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100vh;
    background: var(--ground);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-x: hidden;
  }

  .sky { position: absolute; inset: 0 0 auto 0; width: 100%; height: 70vh; pointer-events: none; }

  main {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 96px 24px 64px;
  }

  .mark { width: 36px; height: 36px; margin-bottom: 40px; }

  .name {
    margin: 0 0 28px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--muted);
    padding-left: 0.32em; /* balances the trailing letter-spacing */
  }

  h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(52px, 9vw, 120px);
    line-height: 0.95;
    letter-spacing: -0.02em;
  }
  h1 em { font-style: italic; color: var(--muted); }

  .lede {
    margin: 36px 0 0;
    font-size: 18px;
    line-height: 1.6;
    color: var(--muted);
  }

  .horizon {
    position: relative;
    width: min(560px, calc(100% - 48px));
    height: 1px;
    margin: 0 auto;
    background: var(--line);
  }

  footer {
    position: relative;
    padding: 28px 24px 36px;
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--dim);
  }

  .rise { animation: rise 1.4s cubic-bezier(.2,.7,.2,1) both; }
  .rise.d1 { animation-delay: .15s; }
  .rise.d2 { animation-delay: .3s; }
  .rise.d3 { animation-delay: .5s; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .rise { animation: none; } }
</style>
</head>
<body>
  <svg class="sky" viewBox="0 0 1440 700" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
    <g fill="#ECEBF3">
      <circle cx="112" cy="96" r="1" opacity=".55"/>
      <circle cx="248" cy="212" r="0.8" opacity=".35"/>
      <circle cx="356" cy="64" r="1.2" opacity=".5"/>
      <circle cx="430" cy="318" r="0.7" opacity=".3"/>
      <circle cx="540" cy="150" r="0.9" opacity=".4"/>
      <circle cx="610" cy="40" r="0.8" opacity=".35"/>
      <circle cx="822" cy="118" r="1" opacity=".45"/>
      <circle cx="905" cy="262" r="0.7" opacity=".3"/>
      <circle cx="1004" cy="58" r="1.3" opacity=".55"/>
      <circle cx="1096" cy="196" r="0.8" opacity=".35"/>
      <circle cx="1188" cy="102" r="1" opacity=".45"/>
      <circle cx="1270" cy="300" r="0.7" opacity=".3"/>
      <circle cx="1352" cy="72" r="1.1" opacity=".5"/>
      <circle cx="70" cy="340" r="0.7" opacity=".25"/>
      <circle cx="1400" cy="236" r="0.8" opacity=".3"/>
      <circle cx="690" cy="280" r="0.6" opacity=".25"/>
    </g>
  </svg>

  <main>
    <img class="mark rise" src="/favicon.svg" width="36" height="36" alt="">
    <p class="name rise d1">Nightfix</p>
    <h1 class="rise d2">Quieter nights<br><em>are coming.</em></h1>
    <p class="lede rise d3">We're building something new, quietly.</p>
  </main>

  <div class="horizon" aria-hidden="true"></div>
  <footer>© 2026 Nightfix</footer>
</body>
</html>
