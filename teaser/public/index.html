<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightfix</title>
<meta name="description" content="Opensource incident response that runs in your own AWS account.">
<meta property="og:title" content="Nightfix">
<meta property="og:description" content="Opensource incident response that runs in your own AWS account.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://nightfix.dev/">
<meta name="theme-color" content="#0B0E17">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:image" content="https://nightfix.dev/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Nightfix. Quieter nights are coming.">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="/fonts/instrument-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Instrument Serif and Instrument Sans, SIL Open Font License 1.1 (see /fonts). */
  @font-face { font-family: 'Instrument Serif'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/instrument-serif-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Instrument Serif'; font-style: italic; font-weight: 400; font-display: swap; src: url(/fonts/instrument-serif-latin-400-italic.woff2) format('woff2'); }
  @font-face { font-family: 'Instrument Sans'; font-style: normal; font-weight: 400; font-display: swap; src: url(/fonts/instrument-sans-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Instrument Sans'; font-style: normal; font-weight: 500; font-display: swap; src: url(/fonts/instrument-sans-latin-500-normal.woff2) format('woff2'); }
  :root {
    --ground: #0B0E17;
    --text: #ECEBF3;
    --muted: #9A9DB5;
    --dim: #7F829C;
    --line: rgba(236, 235, 243, 0.12);
    --serif: 'Instrument Serif', 'Times New Roman', serif;
    --sans: 'Instrument Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100vh;
    background: var(--ground);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-x: hidden;
  }

  .sky { position: absolute; inset: 0 0 auto 0; width: 100%; height: 70vh; pointer-events: none; }

  main {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 96px 24px 64px;
  }

  .mark { width: 36px; height: 36px; margin-bottom: 40px; }

  .name {
    margin: 0 0 28px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--muted);
    padding-left: 0.32em; /* balances the trailing letter-spacing */
  }

  h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(52px, 9vw, 120px);
    line-height: 0.95;
    letter-spacing: -0.02em;
  }
  h1 em { font-style: italic; color: var(--muted); }

  .lede {
    margin: 36px 0 0;
    max-width: 36em;
    text-wrap: balance;
    font-size: 17px;
    line-height: 1.5;
    color: var(--muted);
  }

  .repo {
    margin-top: 32px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 11px 20px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--text);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.02em;
    text-decoration: none;
    transition: border-color .2s, background-color .2s;
  }
  .repo:hover { border-color: rgba(236, 235, 243, 0.35); background: rgba(236, 235, 243, 0.04); }
  .repo:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  .repo svg { width: 16px; height: 16px; flex: none; }


  .horizon {
    position: relative;
    width: min(560px, calc(100% - 48px));
    height: 1px;
    margin: 0 auto;
    background: var(--line);
  }

  footer {
    position: relative;
    padding: 28px 24px 36px;
    text-align: center;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--dim);
  }

  .rise { animation: rise 1.4s cubic-bezier(.2,.7,.2,1) both; }
  .rise.d1 { animation-delay: .15s; }
  .rise.d2 { animation-delay: .3s; }
  .rise.d3 { animation-delay: .45s; }
  .rise.d4 { animation-delay: .6s; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .rise { animation: none; } }
</style>
</head>
<body>
  <svg class="sky" viewBox="0 0 1440 700" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
    <g fill="#ECEBF3">
      <circle cx="112" cy="96" r="1" opacity=".55"/>
      <circle cx="248" cy="212" r="0.8" opacity=".35"/>
      <circle cx="356" cy="64" r="1.2" opacity=".5"/>
      <circle cx="430" cy="318" r="0.7" opacity=".3"/>
      <circle cx="540" cy="150" r="0.9" opacity=".4"/>
      <circle cx="610" cy="40" r="0.8" opacity=".35"/>
      <circle cx="822" cy="118" r="1" opacity=".45"/>
      <circle cx="905" cy="262" r="0.7" opacity=".3"/>
      <circle cx="1004" cy="58" r="1.3" opacity=".55"/>
      <circle cx="1096" cy="196" r="0.8" opacity=".35"/>
      <circle cx="1188" cy="102" r="1" opacity=".45"/>
      <circle cx="1270" cy="300" r="0.7" opacity=".3"/>
      <circle cx="1352" cy="72" r="1.1" opacity=".5"/>
      <circle cx="70" cy="340" r="0.7" opacity=".25"/>
      <circle cx="1400" cy="236" r="0.8" opacity=".3"/>
      <circle cx="690" cy="280" r="0.6" opacity=".25"/>
    </g>
  </svg>

  <main>
    <img class="mark rise" src="/favicon.svg" width="36" height="36" alt="">
    <p class="name rise d1">Nightfix</p>
    <h1 class="rise d2">Quieter nights<br><em>are coming.</em></h1>
    <p class="lede rise d3">Opensource incident response that runs in your own AWS account.</p>
    <a class="repo rise d4" href="https://github.com/peacedouts/nightfix">
      <svg viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      View on GitHub
    </a>
  </main>

  <div class="horizon" aria-hidden="true"></div>
  <footer>© 2026 Nightfix</footer>
</body>
</html>
