{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "nightfix-agent.fullname" . }}
  labels:
    {{- include "nightfix-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "nightfix-agent.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  # Nothing connects in: the agent only connects out.
  ingress: []
  egress:
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - ports:
        - { protocol: TCP, port: 443 }
    {{- if .Values.networkPolicy.podIdentityAgent }}
    # EKS Pod Identity hands out the role's credentials over plain HTTP on
    # the node. The instance metadata service (169.254.169.254, port 80)
    # stays blocked, so steps can't take the node role's credentials.
    - to:
        - ipBlock: { cidr: "169.254.170.23/32" }
        - ipBlock: { cidr: "fd00:ec2::23/128" }
      ports:
        - { protocol: TCP, port: 80 }
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
